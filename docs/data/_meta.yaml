title: Data & Databases
icon: database
description: Modelling data, and what happens when there's a lot of it.
order: 3

# Sized for what the loops in PRD §1.1 actually ask a senior *product* engineer:
# enough relational depth to design a schema out loud and explain why a query is
# slow, the transaction vocabulary that system design rounds lean on, Postgres
# specifically (it is the default at every target company), and the AI-shaped
# corner — vectors living next to the rows they describe.
#
# Reading order is the subsection order: the model and the query, then what
# happens when two of them run at once, then the one database you'll actually
# use, then designing and changing a schema, then picking something else, then
# what breaks at volume, then vectors and pipelines.
#
# Boundaries: how a service talks to its database is `backend`; sharding as a
# distributed-systems argument is `system-design`; chunking, hybrid search and
# retrieval quality are `ai/rag-and-retrieval` — `vector-data` here is only the
# storage-layer half.
#
# Explicit ordering. Folders not listed here still render, appended alphabetically.
